name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main, develop]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium z pełną historią
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Analiza zmian (Git Diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "
          import os, subprocess

          base_sha = os.environ.get('BASE_SHA')
          head_sha = os.environ.get('HEAD_SHA')

          # Zabezpieczenie przed pustym SHA lub nową gałęzią
          if not base_sha or base_sha == '0000000000000000000000000000000000000000':
              base_sha = 'HEAD~1'
          if not head_sha:
              head_sha = 'HEAD'

          try:
              diff = subprocess.check_output(['git', 'diff', f'{base_sha}..{head_sha}']).decode('utf-8', errors='ignore')
              print('=== WYKRYTE ZMIANY ===')
              print(diff if diff else 'Brak zmian w kodzie.')
          except subprocess.CalledProcessError as e:
              print(f'Błąd podczas wykonywania git diff: {e}')
          "

      - name: Automatyczne wdrożenie przez Webhook (tylko gałąź main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Dodanie komentarza do PR
        if: github.event_name == 'pull_request'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d '{"body":"Komentarz wygenerowany przez Gemini..."}'

      - name: Wysłanie diff do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, subprocess, json, urllib.request, urllib.parse

          diff = subprocess.check_output([
              'git', 'diff', f'{os.environ["BASE_SHA"]}..{os.environ["HEAD_SHA"]}'
          ], text=True)

          payload = {
            "contents": [{
              "parts": [{
                "text": "Przeanalizuj te zmiany i napisz krótki komentarz do review:\n\n" + diff
              }]
            }]
          }

          req = urllib.request.Request(
            url=f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST"
          )

          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.loads(resp.read().decode())
              print(data)
          PY